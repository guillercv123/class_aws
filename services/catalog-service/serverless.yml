service: catalog-service
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 10
  logRetentionInDays: 14
  environment:
    STAGE: ${self:provider.stage}
    TABLE_NAME: !Ref CatalogTable
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}, 'INFO'}
    POWERTOOLS_SERVICE_NAME: catalog-service
  tracing:
    lambda: true
    apiGateway: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - !GetAtt CatalogTable.Arn
            - !Sub '${CatalogTable.Arn}/index/*'

custom:
  logLevel:
    demo: DEBUG
    dev: DEBUG
    staging: INFO
    prod: WARN
  # Authorizer compartido del identity-service (sesión 1).
  # En el hands-on se referencia por ARN cross-stack o se despliega un authorizer local.
  authorizer:
    arn: ${cf:identity-service-${self:provider.stage}.AuthorizerLambdaArn}
    type: request
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 0

package:
  individually: true
  patterns:
    - '!**'
    - 'dist/**'

functions:
  # ===== Bloque 4: Handlers CRUD =====
  # TODO Bloque 4: descomenta cuando implementes los handlers.
  createProduct:
    handler: dist/create-product.handler
    events:
      - http: { path: /products, method: post, cors: true, authorizer: '${self:custom.authorizer}' }
