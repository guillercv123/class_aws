resources:
  Resources:
    CatalogTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: orderflow-catalog-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    ProjectorDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: catalog-projector-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

  Outputs:
    CatalogTableName:
      Value: !Ref CatalogTable
      Export:
        Name: ${self:service}-${self:provider.stage}-TableName
    ApiUrl:
      Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'